<!DOCTYPE html>

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<main id="view"></main>

<nav class="bottom">
  <button data-tab="kalk"><span>🧮</span>Kalkulátor</button>
  <button data-tab="proj"><span>👥</span>Ügyfelek</button>

</nav>

<div class="modal" id="modal" hidden><div class="sheet" id="modalBody"></div></div>
<div class="szg" id="szg" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js?v=1.5"></script>
<script src="calc.js?v=1.5"></script>

<script src="szamologep.js?v=1.5"></script>
