<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Építőkalkulátor</title>
<meta name="theme-color" content="#3F3937">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Építőkalk">
<link rel="stylesheet" href="style.css?v=2.3">
<script>try{if(localStorage.getItem('ek_tema')==='sotet')document.documentElement.classList.add('dark')}catch(e){}</script>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="btnBack" aria-label="Vissza" hidden>‹</button>
  <div class="title"><span id="hdrTitle">Építőkalkulátor</span><small id="hdrSub"></small></div>
  <button class="sync" id="btnSync" title="Szinkron állapot"></button>
  <button class="iconbtn" id="btnSzg" aria-label="Számológép" title="Számológép"><svg width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="1.5" y="1" width="15" height="18" rx="3"/><rect x="4.5" y="4" width="9" height="3.5" rx="1" fill="currentColor" stroke="none"/><path d="M5 11.2h.01M9 11.2h.01M13 11.2h.01M5 15h.01M9 15h.01M13 15h.01"/></svg></button>
  <button class="iconbtn" id="btnTheme" aria-label="Téma váltása"></button>
</header>
<div id="datumsor" class="datumsor" hidden></div>

<main id="view"></main>

<nav class="bottom" style="--nx:12.5%">
  <div class="nb-bar" aria-hidden="true"></div>
  <div class="nb-bubble" aria-hidden="true"></div>
  <button data-tab="kalk"><span class="nb-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(-45 12 12)"><rect x="1.5" y="8" width="21" height="8" rx="1.6"/><path d="M5.5 8v3M9 8v2M12.5 8v3M16 8v2M19.5 8v3"/></g></svg></span><span class="nb-lb">Kalkulátor</span></button>
  <button data-tab="proj"><span class="nb-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 20c0-3.4 2.8-5.8 6.2-5.8s6.2 2.4 6.2 5.8"/><path d="M15.8 4.7a3.4 3.4 0 0 1 0 6.6M17.6 14.4c2.1.7 3.6 2.8 3.6 5.6"/></svg></span><span class="nb-lb">Ügyfelek</span></button>
  <button data-tab="ar"><span class="nb-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12.2V4a1 1 0 0 1 1-1h8.2l8.6 8.6a1.4 1.4 0 0 1 0 2l-7.2 7.2a1.4 1.4 0 0 1-2 0z"/><circle cx="7.8" cy="7.8" r="1.6"/></svg></span><span class="nb-lb">Árlista</span></button>
  <button data-tab="tobb"><span class="nb-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><circle cx="17" cy="17" r="3.5"/></svg></span><span class="nb-lb">Több</span></button>
</nav>

<div class="modal" id="modal" hidden><div class="sheet" id="modalBody"></div></div>
<div class="szg" id="szg" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js?v=2.3"></script>
<script src="ikonok.js?v=2.3"></script>
<script src="calc.js?v=2.3"></script>
<script src="app.js?v=2.3"></script>
<script src="szamologep.js?v=2.3"></script>
<script src="megrendeles.js?v=2.3"></script>
<script src="helyiseg.js?v=2.3"></script>
<script src="ajanlat.js?v=2.3"></script>
<script src="szamla.js?v=2.3"></script>
<script src="penzugy.js?v=2.3"></script>
<script src="kuka.js?v=2.3"></script>
</body>
</html>
